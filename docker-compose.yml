services:
  api:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm ci || npm install && node src/api/index.js"
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      JWT_SECRET: "changeme"
      JWT_EXPIRES_IN: 3600
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: restaurante
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672"
    volumes:
      - ./:/app
    depends_on:
      - db
      - rabbitmq

  db:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: restaurante
    volumes:
      - pgdata:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # UI de administración
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

volumes:
  pgdata:
