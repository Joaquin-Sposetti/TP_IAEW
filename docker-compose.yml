

services:
  api:
    image: node:20-alpine
    container_name: api
    working_dir: /app
    command: sh -c "npm install && node src/api/index.js"
    ports:
      - "8081:8080"
    environment:
      PORT: 8080
      JWT_SECRET: "changeme"
      JWT_EXPIRES_IN: 3600

      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: restaurante
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432

      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672

      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: api
    volumes:
      - ./:/app
      - api_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_started

  db:
    image: postgres:16
    container_name: db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: restaurante
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq  
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "status"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ======================================================
  # 🔵 WS - WebSocket Server
  # ======================================================
  ws:
    image: node:20-alpine
    container_name: ws
    working_dir: /app
    command: sh -c "npm install && node src/ws/index.js"
    ports:
      - "8090:8090"
    environment:
      WS_PORT: 8090
      JWT_SECRET: "changeme"
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672

      # OTEL
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: ws
    volumes:
      - ./:/app
      - ws_node_modules:/app/node_modules
    depends_on:
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_started

  # ======================================================
  # ⚙️ WORKER - Procesamiento Asíncrono
  # ======================================================
  worker:
    image: node:20-alpine
    container_name: worker
    working_dir: /app
    command: sh -c "npm install && node src/worker/index.js"
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: restaurante

      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672

      # OTEL
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: worker
    volumes:
      - ./:/app
      - worker_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_started

  # ======================================================
  # 🟢 FRONTEND - Vite + React
  # ======================================================
  frontend:
    image: node:20-alpine
    container_name: frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8081
      VITE_WS_URL: ws://localhost:8090
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_started
      ws:
        condition: service_started

  # ======================================================
  # 🔍 OpenTelemetry Collector
  # ======================================================
  otel-collector:
    image: otel/opentelemetry-collector:latest
    container_name: otel-collector
    volumes:
      - ./otel-collector-config.yml:/etc/otel/config.yaml
    command: ["--config=/etc/otel/config.yaml"]
    ports:
      - "4317:4317"  # OTLP gRPC
      - "4318:4318"  # OTLP HTTP
    depends_on:
      jaeger:
        condition: service_started

  # ======================================================
  # 🟦 Jaeger — Trazas distribuidas
  # ======================================================
  jaeger:
    image: jaegertracing/all-in-one:1.53
    container_name: jaeger
    ports:
      - "16686:16686" # UI Jaeger
      - "14250:14250" # gRPC ingest
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  # ======================================================
  # 📊 Grafana
  # ======================================================
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    depends_on:
      jaeger:
        condition: service_started
      otel-collector:
        condition: service_started

# ======================================================
# 📦 Volúmenes persistentes
# ======================================================
volumes:
  pgdata:
  rabbitmq_data:
  api_node_modules:
  ws_node_modules:
  worker_node_modules:
  frontend_node_modules:
